[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita-meta-publisher"
version = "1.2.0"
description = "Publicador de campañas Meta para Orbita, con pantalla local"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Asistente IA de la pantalla local.
ia = ["anthropic>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["orbita_ads*"]

[tool.setuptools.package-data]
orbita_ads = ["web/*", "tools.json"]
